name: Autonomous Portfolio Discovery Loop

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  broadcast-portfolio:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Broadcast All 4 Micro-Assets
        run: python register_all.py
